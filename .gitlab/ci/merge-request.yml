include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Dependency-Scanning.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

# A shared-package change affects both consumers. Workspace and MR CI changes
# deliberately run every component to validate the merged configuration.
.mr-frontend-rules:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - .gitlab-ci.yml
        - .gitlab/ci/**/*
        - apps/frontend/**/*
        - packages/shared/**/*
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - eslint.config.mjs

.mr-backend-rules:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - .gitlab-ci.yml
        - .gitlab/ci/**/*
        - apps/backend/**/*
        - packages/shared/**/*
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - eslint.config.mjs

.mr-shared-rules:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - .gitlab-ci.yml
        - .gitlab/ci/**/*
        - packages/shared/**/*
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - eslint.config.mjs

# Use optimized templates with shared dependencies
"mr:frontend:lint":
  extends: [.frontend-lint-with-deps, .mr-frontend-rules]

"mr:frontend:typecheck":
  extends: [.frontend-typecheck-with-deps, .mr-frontend-rules]

"mr:frontend:test":
  extends: [.frontend-test-with-deps, .mr-frontend-rules]

"mr:frontend:build":
  extends: [.frontend-build-with-deps, .mr-frontend-rules]

"mr:backend:lint":
  extends: [.backend-lint-with-deps, .mr-backend-rules]

"mr:backend:typecheck":
  extends: [.backend-typecheck-with-deps, .mr-backend-rules]

"mr:backend:test":
  extends: [.backend-test-with-deps, .mr-backend-rules]

"mr:backend:build":
  extends: [.backend-build-with-deps, .mr-backend-rules]

"mr:shared:lint":
  extends: [.shared-lint-with-deps, .mr-shared-rules]

"mr:shared:typecheck":
  extends: [.shared-typecheck-with-deps, .mr-shared-rules]

"mr:shared:test":
  extends: [.shared-test-with-deps, .mr-shared-rules]

"mr:shared:build":
  extends: [.shared-build-with-deps, .mr-shared-rules]

# Scanner images do not contain Node.js. Secret detection remains enabled for
# every MR, including documentation-only changes, while the heavier scanners
# follow the files they can actually analyze.
secret_detection:
  stage: security
  before_script: []
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

semgrep-sast:
  stage: security
  before_script: []
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - .gitlab-ci.yml
        - .gitlab/ci/**/*
        - apps/frontend/**/*
        - apps/backend/**/*
        - packages/shared/**/*
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - eslint.config.mjs

gemnasium-dependency_scanning:
  stage: security
  before_script: []
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - .gitlab-ci.yml
        - .gitlab/ci/**/*
        - package.json
        - apps/frontend/package.json
        - apps/backend/package.json
        - packages/shared/package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
