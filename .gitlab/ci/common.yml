        path: packages/shared/coverage/cobertura-coverage.xml

.frontend-build:
  extends: .independent
  stage: build
  script:
    - pnpm --filter @brickr/frontend build

.backend-build:
  extends:
    - .independent
    - .backend-job
  stage: build
  script:
    - pnpm --filter @brickr/backend build

.shared-build:
  extends: .independent
  stage: build
  script:
    - pnpm --filter @brickr/shared build

# Optimized templates using shared dependencies
.frontend-lint-with-deps:
