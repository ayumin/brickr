# Shared Node.js setup and reusable job bodies. Trigger-specific files add
# their own rules and public job names by extending these hidden jobs.
.node-setup:
  before_script:
    - corepack enable
    - corepack prepare pnpm@11.21.0 --activate
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile

default:
  image: node:22-bookworm-slim
  interruptible: true
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store/
  before_script:
    - !reference [.node-setup, before_script]

.backend-job:
  before_script:
    - !reference [.node-setup, before_script]
    - pnpm --filter @brickr/backend db:generate

.independent:
  needs: []

.frontend-lint:
  extends: .independent
  stage: lint
  script:
    - pnpm --filter @brickr/frontend lint

.backend-lint:
  extends:
    - .independent
    - .backend-job
  stage: lint
  script:
    - pnpm --filter @brickr/backend lint

.shared-lint:
  extends: .independent
  stage: lint
  script:
    - pnpm --filter @brickr/shared lint

.frontend-typecheck:
  extends: .independent
  stage: typecheck
  script:
    - pnpm --filter @brickr/frontend typecheck

.backend-typecheck:
  extends:
    - .independent
    - .backend-job
  stage: typecheck
  script:
    - pnpm --filter @brickr/backend typecheck

.shared-typecheck:
  extends: .independent
  stage: typecheck
  script:
    - pnpm --filter @brickr/shared typecheck

.frontend-test:
  extends: .independent
  stage: test
  script:
    - pnpm --filter @brickr/frontend test --coverage
  coverage: '/Statements\s*:\s*([\d.]+)%/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: apps/frontend/coverage/cobertura-coverage.xml

.backend-test:
  extends:
    - .independent
    - .backend-job
  stage: test
  script:
    - pnpm --filter @brickr/backend test --coverage
  coverage: '/Statements\s*:\s*([\d.]+)%/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: apps/backend/coverage/cobertura-coverage.xml

.shared-test:
  extends: .independent
  stage: test
  script:
    - pnpm --filter @brickr/shared test --coverage
  coverage: '/Statements\s*:\s*([\d.]+)%/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: packages/shared/coverage/cobertura-coverage.xml

.frontend-build:
  extends: .independent
  stage: build
  script:
    - pnpm --filter @brickr/frontend build

.backend-build:
  extends:
    - .independent
    - .backend-job
  stage: build
  script:
    - pnpm --filter @brickr/backend build

.shared-build:
  extends: .independent
  stage: build
  script:
    - pnpm --filter @brickr/shared build
