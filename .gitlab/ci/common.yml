# Shared Node.js setup and reusable job bodies. Trigger-specific files add
# their own rules and public job names by extending these hidden jobs.
.node-setup:
  before_script:
    - corepack enable
    - corepack prepare pnpm@11.21.0 --activate
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile

default:
  image: node:22-bookworm-slim
  interruptible: true
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store/
  before_script:
    - !reference [.node-setup, before_script]

# Shared dependency installation job - runs once, shares via artifacts
"deps:install":
  stage: .pre
  script:
    - pnpm --filter @brickr/backend db:generate
  artifacts:
    paths:
      - node_modules/
      - apps/frontend/node_modules/
      - apps/backend/node_modules/
      - packages/shared/node_modules/
      - apps/backend/src/infrastructure/database/generated/
    expire_in: 1 hour
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - .gitlab-ci.yml
        - .gitlab/ci/**/*
        - apps/frontend/**/*
        - apps/backend/**/*
        - packages/shared/**/*
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - eslint.config.mjs

# Template for jobs that use pre-installed dependencies
.with-deps:
  needs:
    - job: "deps:install"
      artifacts: true
  before_script:
    - corepack enable
    - corepack prepare pnpm@11.21.0 --activate

.backend-job:
  before_script:
    - !reference [.node-setup, before_script]
    - pnpm --filter @brickr/backend db:generate

# Backend job using shared deps (no pnpm install, no db:generate)
.backend-job-with-deps:
  extends: .with-deps

.independent:
  needs: []

.frontend-lint:
  extends: .independent
  stage: lint
  script:
    - pnpm --filter @brickr/frontend lint

.backend-lint:
  extends:
    - .independent
    - .backend-job
  stage: lint
  script:
    - pnpm --filter @brickr/backend lint

.shared-lint:
  extends: .independent
  stage: lint
  script:
    - pnpm --filter @brickr/shared lint

.frontend-typecheck:
  extends: .independent
  stage: typecheck
  script:
    - pnpm --filter @brickr/frontend typecheck

.backend-typecheck:
  extends:
    - .independent
    - .backend-job
  stage: typecheck
  script:
    - pnpm --filter @brickr/backend typecheck

.shared-typecheck:
  extends: .independent
  stage: typecheck
  script:
    - pnpm --filter @brickr/shared typecheck

.frontend-test:
  extends: .independent
  stage: test
  script:
    - pnpm --filter @brickr/frontend test --coverage
  coverage: '/Statements\s*:\s*([\d.]+)%/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: apps/frontend/coverage/cobertura-coverage.xml

.backend-test:
  extends:
    - .independent
    - .backend-job
  stage: test
  script:
    - pnpm --filter @brickr/backend test --coverage
  coverage: '/Statements\s*:\s*([\d.]+)%/'
  artifacts:
    reports:
