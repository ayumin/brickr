# Periodic collection of GitLab Duo Agent Platform sessions.
#
# Flow triggers have no schedule type (only mention, assign, assign reviewer and
# pipeline events), so a pipeline schedule is what drives this.
#
# The job is inert until a human does the one-time setup, so merging this file
# changes nothing by itself:
#
#   1. Create a project or group access token with the `api` and
#      `write_repository` scopes.
#   2. Add it as a masked, protected CI/CD variable named `DUO_RETRO_TOKEN`.
#   3. Create a pipeline schedule on the default branch, for example weekly.
#
# Scope on purpose: this only collects sessions and opens a merge request with
# the mechanical part of the retrospective filled in. The qualitative part is
# written afterwards, because that is where the value of a retrospective is and
# aggregation does not produce it.
.duo-retrospective-rules:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $DUO_RETRO_TOKEN
    # Lets a human dry-run the collector from the pipeline UI before trusting
    # the schedule. allow_failure keeps a bad run from blocking anything.
    - if: $CI_PIPELINE_SOURCE == "web" && $DUO_RETRO_TOKEN
      when: manual
      allow_failure: true

"duo:collect-retrospective":
  extends: .duo-retrospective-rules
  stage: validate
  image: node:22-bookworm-slim
  before_script: []
  needs: []
  interruptible: false
  variables:
    RETRO_DAYS: "7"
  script:
    - apt-get update
    - DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends ca-certificates git
    - node scripts/collect-duo-sessions.mjs --days="$RETRO_DAYS"
    - RETRO_DATE="$(date -u +%Y-%m-%d)"
    - RETRO_BRANCH="docs/duo-retrospective-$RETRO_DATE"
    - git config user.email "duo-retrospective@noreply.$CI_SERVER_HOST"
    - git config user.name "Duo Retrospective"
    - git checkout -b "$RETRO_BRANCH"
    - git add docs/duo-sessions
    - |
      if git diff --cached --quiet; then
        echo "No new session data for $RETRO_DATE. Nothing to open a merge request for."
        exit 0
      fi
    - git commit -m "docs: collect Duo sessions for $RETRO_DATE" -m "Generated by scripts/collect-duo-sessions.mjs. The qualitative sections are still empty and need to be written before this is merged."
    - |
      git push "https://oauth2:${DUO_RETRO_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "$RETRO_BRANCH" \
        -o merge_request.create \
        -o merge_request.target="$CI_DEFAULT_BRANCH" \
        -o merge_request.title="Draft: docs: Duo セッション振り返り $RETRO_DATE" \
        -o merge_request.description="自動収集された骨組みです。指標とセッション一覧のみ生成済みで、上手くいったこと・詰まったこと・蒸留は未記入です。LEARNED.md の更新ルールに従って埋めてください。" \
        -o merge_request.remove_source_branch
  artifacts:
    when: always
    expire_in: 1 month
    paths:
      - docs/duo-sessions/
