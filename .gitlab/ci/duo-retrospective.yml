# Periodic collection of GitLab Duo Agent Platform sessions.
#
# Flow triggers have no schedule type (only mention, assign, assign reviewer and
# pipeline events), so a pipeline schedule is what drives this.
#
# The job is inert until a human does the one-time setup, so merging this file
# changes nothing by itself:
#
#   1. Create a project or group access token with the `api` and
#      `write_repository` scopes.
#   2. Add it as a masked CI/CD variable named `DUO_RETRO_TOKEN`.
#   3. Create a pipeline schedule on the default branch, for example weekly, and
#      add `DUO_RETRO_SCHEDULE` = `true` as a variable **on that schedule**.
#
# Step 3 matters: CI/CD variables are available to every pipeline in the
# project, so keying only on `$CI_PIPELINE_SOURCE == "schedule"` would make any
# unrelated schedule open a spurious retrospective merge request. A variable set
# on the schedule itself is what scopes this to the intended one.
#
# Scope on purpose: this only collects sessions and opens a merge request with
# the mechanical part of the retrospective filled in. The qualitative part is
# written afterwards, because that is where the value of a retrospective is and
# aggregation does not produce it.
.duo-retrospective-rules:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $DUO_RETRO_SCHEDULE == "true" && $DUO_RETRO_TOKEN
    # Lets a human dry-run the collector from the pipeline UI before trusting
    # the schedule. allow_failure keeps a bad run from blocking anything.
    - if: $CI_PIPELINE_SOURCE == "web" && $DUO_RETRO_TOKEN
      when: manual
      allow_failure: true

"duo:collect-retrospective":
  extends: .duo-retrospective-rules
  stage: validate
  image: node:22-bookworm-slim
  before_script: []
  needs: []
  interruptible: false
  variables:
    RETRO_DAYS: "7"
    RETRO_ENV_FILE: duo-retro.env
  script:
    - apt-get update
    - DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends ca-certificates git
    - node scripts/collect-duo-sessions.mjs --days="$RETRO_DAYS" --env-file="$RETRO_ENV_FILE"
    # RETRO_DATE and RETRO_OUTPUT come from the collector rather than from a
    # second `date` call, so the branch name always matches the file that was
    # actually written even if the run straddles UTC midnight.
    - . "./$RETRO_ENV_FILE"
    - |
      if [ "$RETRO_SESSIONS" = "0" ]; then
        echo "No sessions in the window. Nothing to open a merge request for."
        exit 0
      fi
    - git config user.email "duo-retrospective@noreply.$CI_SERVER_HOST"
    - git config user.name "Duo Retrospective"
    - git checkout -b "docs/duo-retrospective-$RETRO_DATE"
    - git add "$RETRO_OUTPUT"
    - |
      if git diff --cached --quiet; then
        echo "$RETRO_OUTPUT is unchanged. Nothing to open a merge request for."
        exit 0
      fi
    - git commit -m "docs: collect Duo sessions for $RETRO_DATE" -m "Generated by scripts/collect-duo-sessions.mjs. The qualitative sections are still empty and need to be written before this is merged."
    - |
      git push "https://oauth2:${DUO_RETRO_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "docs/duo-retrospective-$RETRO_DATE" \
        -o merge_request.create \
        -o merge_request.target="$CI_DEFAULT_BRANCH" \
        -o merge_request.title="Draft: docs: Duo セッション振り返り $RETRO_DATE" \
        -o merge_request.description="自動収集された骨組みです。指標とセッション一覧のみ生成済みで、上手くいったこと・詰まったこと・蒸留は未記入です。LEARNED.md の更新ルールに従って埋めてください。" \
        -o merge_request.remove_source_branch
  artifacts:
    when: always
    expire_in: 1 month
    paths:
      - docs/duo-sessions/

# scripts/ has no test harness in this repository, so at least catch syntax
# errors before they reach a scheduled run where nobody is watching.
# End-to-end verification needs DUO_RETRO_TOKEN and is done with the manual web
# trigger above, before the schedule is trusted.
"duo:collector-syntax":
  stage: validate
  image: node:22-bookworm-slim
  before_script: []
  needs: []
  script:
    - node --check scripts/collect-duo-sessions.mjs
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - scripts/collect-duo-sessions.mjs
        - .gitlab/ci/duo-retrospective.yml
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - scripts/collect-duo-sessions.mjs
        - .gitlab/ci/duo-retrospective.yml
