services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-enjo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-enjo}
      POSTGRES_DB: ${POSTGRES_DB:-enjo}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-enjo} -d ${POSTGRES_DB:-enjo}"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Inside compose the backend reaches Postgres at db:5432.
      DATABASE_URL: postgresql://${POSTGRES_USER:-enjo}:${POSTGRES_PASSWORD:-enjo}@db:5432/${POSTGRES_DB:-enjo}?schema=public
      PORT: "3000"
      HOST: 0.0.0.0
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-30000}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-1}
      USE_MOCK_LLM: ${USE_MOCK_LLM:-false}
      MIN_RESPONDERS: ${MIN_RESPONDERS:-2}
      MAX_RESPONDERS: ${MAX_RESPONDERS:-6}
      CONTEXT_POST_LIMIT: ${CONTEXT_POST_LIMIT:-16}
      MAX_CONCURRENT_CHARACTERS: ${MAX_CONCURRENT_CHARACTERS:-4}
      MAX_CASCADE_DEPTH: ${MAX_CASCADE_DEPTH:-2}
    ports:
      - "3000:3000"
    volumes:
      # Live reload against the host source without clobbering node_modules.
      - ./apps/backend/src:/app/apps/backend/src
      - ./apps/backend/prisma:/app/apps/backend/prisma
      - ./packages/shared/src:/app/packages/shared/src

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # The browser talks to the backend directly, so this is a host URL.
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000}
    ports:
      - "5173:5173"
    volumes:
      - ./apps/frontend/src:/app/apps/frontend/src
      - ./apps/frontend/index.html:/app/apps/frontend/index.html
      - ./packages/shared/src:/app/packages/shared/src

volumes:
  db-data:
