stages:
  - lint
  - typecheck
  - test
  - build
  - security

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Dependency-Scanning.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

default:
  image: node:22-bookworm-slim
  interruptible: true
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store/
  before_script:
    - corepack enable
    - corepack prepare pnpm@11.21.0 --activate
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
    - pnpm --filter @brickr/backend db:generate

"frontend:lint":
  stage: lint
  script:
    - pnpm --filter @brickr/frontend lint

"backend:lint":
  stage: lint
  script:
    - pnpm --filter @brickr/backend lint

"shared:lint":
  stage: lint
  script:
    - pnpm --filter @brickr/shared lint

"frontend:typecheck":
  stage: typecheck
  script:
    - pnpm --filter @brickr/frontend typecheck

"backend:typecheck":
  stage: typecheck
  script:
    - pnpm --filter @brickr/backend typecheck

"shared:typecheck":
  stage: typecheck
  script:
    - pnpm --filter @brickr/shared typecheck

"frontend:test":
  stage: test
  script:
    - pnpm --filter @brickr/frontend test --coverage
  coverage: '/Statements\s*:\s*([\d.]+)%/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: apps/frontend/coverage/cobertura-coverage.xml

"backend:test":
  stage: test
  script:
    - pnpm --filter @brickr/backend test --coverage
  coverage: '/Statements\s*:\s*([\d.]+)%/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: apps/backend/coverage/cobertura-coverage.xml

"shared:test":
  stage: test
  script:
    - pnpm --filter @brickr/shared test --coverage
  coverage: '/Statements\s*:\s*([\d.]+)%/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: packages/shared/coverage/cobertura-coverage.xml

"frontend:build":
  stage: build
  script:
    - pnpm --filter @brickr/frontend build
  artifacts:
    name: "brickr-frontend-$CI_COMMIT_SHORT_SHA"
    paths:
      - apps/frontend/dist/
    expire_in: 1 week

"backend:build":
  stage: build
  script:
    - pnpm --filter @brickr/backend build
  artifacts:
    name: "brickr-backend-$CI_COMMIT_SHORT_SHA"
    paths:
      - apps/backend/dist/
    expire_in: 1 week

"shared:build":
  stage: build
  script:
    - pnpm --filter @brickr/shared build
  artifacts:
    name: "brickr-shared-$CI_COMMIT_SHORT_SHA"
    paths:
      - packages/shared/dist/
    expire_in: 1 week

# Security scanner jobs use their own minimal images that do not have Node.js
# or corepack. Override before_script to prevent the default Node.js setup
# from running inside those images (which would fail with "corepack: not found").
secret_detection:
  before_script: []

semgrep-sast:
  before_script: []

gemnasium-dependency_scanning:
  before_script: []
