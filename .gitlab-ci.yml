stages:
  - lint
  - typecheck
  - test
  - build

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

default:
  image: node:22-bookworm-slim
  interruptible: true
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store/
  before_script:
    - corepack enable
    - corepack prepare pnpm@11.21.0 --activate
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
    - pnpm --filter @enjo/backend db:generate

"frontend:lint":
  stage: lint
  script:
    - pnpm --filter @enjo/frontend lint

"backend:lint":
  stage: lint
  script:
    - pnpm --filter @enjo/backend lint

"shared:lint":
  stage: lint
  script:
    - pnpm --filter @enjo/shared lint

"frontend:typecheck":
  stage: typecheck
  script:
    - pnpm --filter @enjo/frontend typecheck

"backend:typecheck":
  stage: typecheck
  script:
    - pnpm --filter @enjo/backend typecheck

"shared:typecheck":
  stage: typecheck
  script:
    - pnpm --filter @enjo/shared typecheck

"frontend:test":
  stage: test
  script:
    - pnpm --filter @enjo/frontend test -- --coverage
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: apps/frontend/coverage/cobertura-coverage.xml

"backend:test":
  stage: test
  script:
    - pnpm --filter @enjo/backend test -- --coverage
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: apps/backend/coverage/cobertura-coverage.xml

"shared:test":
  stage: test
  script:
    - pnpm --filter @enjo/shared test -- --coverage
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: packages/shared/coverage/cobertura-coverage.xml

"frontend:build":
  stage: build
  script:
    - pnpm --filter @enjo/frontend build
  artifacts:
    name: "brickr-frontend-$CI_COMMIT_SHORT_SHA"
    paths:
      - apps/frontend/dist/
    expire_in: 1 week

"backend:build":
  stage: build
  script:
    - pnpm --filter @enjo/backend build
  artifacts:
    name: "brickr-backend-$CI_COMMIT_SHORT_SHA"
    paths:
      - apps/backend/dist/
    expire_in: 1 week

"shared:build":
  stage: build
  script:
    - pnpm --filter @enjo/shared build
  artifacts:
    name: "brickr-shared-$CI_COMMIT_SHORT_SHA"
    paths:
      - packages/shared/dist/
    expire_in: 1 week
