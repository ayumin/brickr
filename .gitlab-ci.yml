stages:
  - validate
  - lint
  - typecheck
  - test
  - build
  - e2e
  - security
  - approve
  - container
  - deploy

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

include:
  - local: /.gitlab/ci/common.yml
  - local: /.gitlab/ci/branch.yml
  - local: /.gitlab/ci/merge-request.yml
  - local: /.gitlab/ci/main.yml
  - local: /.gitlab/ci/quality.yml
  - local: /.gitlab/ci/duo-retrospective.yml
  - local: /.gitlab/ci/staging-maintenance.yml
  - local: /.gitlab/ci/infrastructure.yml
  - local: /.gitlab/ci/release.yml
